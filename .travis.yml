
language: python
python:
  - "3.12"

install:
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt
  - pip install coveralls

before_script:
  - python manage.py check

script:
  - python -m black --check .
  - python -m flake8 .
  - python -m coverage run manage.py test
  - python -m coverage report

after_success:
  - python -m coverage xml -o coverage.xml
  - |
    set -o pipefail
    mkdir -p "$HOME/.local/bin"
    curl -fsSL https://coveralls.io/coveralls-linux.tar.gz | tar -xz -C "$HOME/.local/bin"
    "$HOME/.local/bin/coveralls" report --format=cobertura coverage.xml

deploy:
  provider: elasticbeanstalk
  edge: true
  region: us-east-2
  app: swe1-app
  env: swe1-env
  bucket: elasticbeanstalk-us-east-2-122452779484
  wait_until_deployed: true
  on:
    branch: main