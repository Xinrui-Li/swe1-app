language: python
python:
  - "3.12"

install:
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt

before_script:
  - python manage.py check

script:
  - python -m black --check .
  - python -m flake8 .
  - python -m coverage run manage.py test
  - python -m coverage report

after_success:
  - python -m coverage xml -o coverage.xml
  - |
    export CI_NAME="travis-ci"
    export CI_BUILD_NUMBER="$TRAVIS_BUILD_NUMBER"
    export CI_BUILD_URL="$TRAVIS_BUILD_WEB_URL"
    export CI_BRANCH="$TRAVIS_BRANCH"
    export CI_COMMIT_ID="$TRAVIS_COMMIT"
    export CI_COMMIT_MESSAGE="$TRAVIS_COMMIT_MESSAGE"
    export CI_COMMITTER_NAME="$(git log -1 --format='%an')"
    export CI_COMMITTER_EMAIL="$(git log -1 --format='%ae')"
    python -m coveralls
